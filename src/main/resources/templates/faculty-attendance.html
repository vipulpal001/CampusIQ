<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Attendance - CampusIQ ERP</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/Img%20Assist/favicon.ico">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 antialiased flex flex-col">

    <!-- Top Navbar -->
    <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm h-16 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <span class="text-xl font-extrabold tracking-tight text-slate-900">RKGIT ERP</span>
            <span class="text-[11px] font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-0.5 rounded-full uppercase">Class Attendance Workspace</span>
        </div>
        <div>
            <a th:href="@{/faculty/dashboard}" class="text-xs font-semibold text-slate-600 hover:text-indigo-600">&larr; Back to Faculty Dashboard</a>
        </div>
    </header>

    <main class="flex-1 p-6 lg:p-8 max-w-7xl mx-auto w-full">

        <div th:if="${successMessage}" class="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 text-sm" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-800 text-sm" th:text="${errorMessage}"></div>

        <!-- Course & Date Filter Card -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs mb-8">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Select Lecture & Date</h2>
            <p class="text-xs text-slate-500 mb-4">Choose an assigned course and session date to record classroom presence</p>

            <form th:action="@{/faculty/attendance}" method="get" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Course / Subject</label>
                    <select name="courseId" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5" required>
                        <option value="">-- Choose Subject --</option>
                        <option th:each="c : ${courses}" 
                                th:value="${c.id}" 
                                th:text="${c.courseCode} + ' - ' + ${c.name} + ' (Sem ' + ${c.semester} + ')'"
                                th:selected="${c.id == selectedCourseId}">
                        </option>
                    </select>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 mb-1">Lecture Date</label>
                    <input type="date" name="date" th:value="${selectedDate}" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5">
                </div>

                <div class="flex items-end">
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-colors uppercase tracking-wider">
                        Load Student Roster
                    </button>
                </div>
            </form>
        </div>

        <!-- Student Attendance Sheet Form -->
        <div th:if="${selectedCourse != null}" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100 mb-4">
                <div>
                    <h2 class="text-base font-bold text-slate-900" th:text="'Class Roster: ' + ${selectedCourse.name} + ' (' + ${selectedCourse.courseCode} + ')'"></h2>
                    <p class="text-xs text-slate-500" th:text="'Date: ' + ${selectedDate} + ' • Department: ' + ${selectedCourse.department.name}"></p>
                </div>

                <!-- Mark all Present helper -->
                <button type="button" onclick="markAllPresent()" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs rounded-lg transition-colors">
                    ✓ Mark All Present
                </button>
            </div>

            <form th:action="@{/faculty/attendance/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="courseId" th:value="${selectedCourse.id}" />
                <input type="hidden" name="date" th:value="${selectedDate}" />

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 border-b border-slate-100 uppercase text-slate-500 font-semibold">
                            <tr>
                                <th class="py-3 px-4">Roll Number</th>
                                <th class="py-3 px-4">Student Name</th>
                                <th class="py-3 px-4">Department / Sem</th>
                                <th class="py-3 px-4 text-center">Attendance Status</th>
                                <th class="py-3 px-4">Faculty Remarks</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr th:each="st : ${enrolledStudents}" class="hover:bg-slate-50/60">
                                <td class="py-3 px-4 font-bold text-slate-900" th:text="${st.rollNumber}"></td>
                                <td class="py-3 px-4 font-semibold text-slate-800" th:text="${st.fullName}"></td>
                                <td class="py-3 px-4" th:text="${st.department.code} + ' • Sem ' + ${st.semester}"></td>
                                
                                <td class="py-3 px-4 text-center">
                                    <div class="inline-flex items-center gap-3 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                                        <label class="flex items-center gap-1 cursor-pointer">
                                            <input type="radio" th:name="'status_' + ${st.id}" value="PRESENT" 
                                                   th:checked="${statusMap != null and statusMap[st.id] == 'PRESENT' or (statusMap == null or statusMap[st.id] == null)}"
                                                   class="status-present text-emerald-600 focus:ring-emerald-500">
                                            <span class="text-xs font-bold text-emerald-700">Present</span>
                                        </label>
                                        <label class="flex items-center gap-1 cursor-pointer">
                                            <input type="radio" th:name="'status_' + ${st.id}" value="ABSENT"
                                                   th:checked="${statusMap != null and statusMap[st.id] == 'ABSENT'}"
                                                   class="text-red-600 focus:ring-red-500">
                                            <span class="text-xs font-bold text-red-700">Absent</span>
                                        </label>
                                        <label class="flex items-center gap-1 cursor-pointer">
                                            <input type="radio" th:name="'status_' + ${st.id}" value="LATE"
                                                   th:checked="${statusMap != null and statusMap[st.id] == 'LATE'}"
                                                   class="text-amber-600 focus:ring-amber-500">
                                            <span class="text-xs font-bold text-amber-700">Late</span>
                                        </label>
                                    </div>
                                </td>

                                <td class="py-3 px-4">
                                    <input type="text" th:name="'remarks_' + ${st.id}" 
                                           th:value="${remarksMap != null ? remarksMap[st.id] : ''}" 
                                           placeholder="Optional remark..."
                                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                    <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-xs transition-colors uppercase tracking-wider">
                        💾 Save & Submit Attendance
                    </button>
                </div>
            </form>
        </div>

    </main>

    <script>
        function markAllPresent() {
            document.querySelectorAll('.status-present').forEach(radio => radio.checked = true);
        }
    </script>

</body>
</html>
