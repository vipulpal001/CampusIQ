<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - CampusIQ ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6 antialiased">
    <div class="max-w-md w-full bg-slate-800/80 border border-red-500/30 rounded-3xl p-8 text-center shadow-2xl backdrop-blur-xl">
        <div class="w-16 h-16 rounded-2xl bg-red-500/20 border border-red-500/40 text-red-400 mx-auto flex items-center justify-center mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h1 class="text-2xl font-black text-white">403 • Access Restricted</h1>
        <p class="text-xs text-slate-400 mt-2 leading-relaxed">
            You do not have the required administrative or faculty security clearance to view this resource. Student accounts cannot access the administrative governance portal.
        </p>
        <div class="mt-6 pt-6 border-t border-white/10 flex flex-col gap-2.5">
            <a th:href="@{/dashboard}" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-colors">
                Return to Student Dashboard
            </a>
            <a th:href="@{/login?logout}" class="w-full py-2.5 text-xs text-slate-400 hover:text-white transition-colors">
                Log Out / Switch Account
            </a>
        </div>
    </div>
</body>
</html>
